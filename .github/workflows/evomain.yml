name: Build GTA9 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernelsu_tag:
        description: 'KernelSU tag or "main" for latest'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex \
            git kmod libelf-dev libssl-dev lz4 python3 \
            zip wget curl sed binutils-aarch64-linux-gnu \
            crossbuild-essential-arm64 clang lld llvm device-tree-compiler

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git gta9
          cd gta9
          git submodule sync --recursive
          git submodule update --init --depth=1

      - name: Fetch latest KernelSU version
        id: ksu_info
        run: |
          TAG="${{ github.event.inputs.kernelsu_tag }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            LATEST=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest \
              | grep '"tag_name"' | cut -d'"' -f4)
            echo "ksu_version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "ksu_version=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Integrate KernelSU via setup.sh
        run: |
          cd gta9
          KSU_TAG="${{ steps.ksu_info.outputs.ksu_version }}"
          # Manual integrasi (fix divergent branches yg bikin setup.sh gagal)
          rm -rf KernelSU
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          if [ -n "$KSU_TAG" ] && [ "$KSU_TAG" != "main" ]; then
            git fetch --depth 1 origin tag "$KSU_TAG" || true
            git checkout -f "$KSU_TAG" 2>/dev/null || git checkout -f FETCH_HEAD 2>/dev/null || true
            echo "KernelSU tag: $(git describe --tags 2>/dev/null || echo $KSU_TAG)"
          else
            git checkout -f main 2>/dev/null || true
          fi
          cd ..
          ln -sf "$(realpath --relative-to="$PWD/drivers" "$PWD/KernelSU/kernel")" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          ls -la KernelSU/kernel/ 2>/dev/null || ls -la drivers/kernelsu/ 2>/dev/null

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/toolchain/clang
          wget -q --show-progress \
            https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220902-full/Clang-14.0.6-x86_64.tar.gz \
            -O /tmp/clang.tar.gz && \
            tar -xzf /tmp/clang.tar.gz -C $HOME/toolchain/clang/ && rm /tmp/clang.tar.gz && \
            echo "Clang ready." || {
              echo "Download failed — falling back to system clang"
              mkdir -p $HOME/toolchain/clang/bin
              ln -sf /usr/bin/clang $HOME/toolchain/clang/bin/clang
              ln -sf /usr/bin/ld.lld $HOME/toolchain/clang/bin/ld.lld
              for t in /usr/bin/llvm-*; do [ -f "$t" ] && ln -sf "$t" $HOME/toolchain/clang/bin/; done
            }
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Configure kernel
        run: |
          cd gta9
          export PATH=$HOME/toolchain/clang/bin:$PATH
          make O=out ARCH=arm64 gta9_00_defconfig
          # KernelSU + pendukung
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_OVERLAY_FS
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-KSU-${{ steps.ksu_info.outputs.ksu_version }}" \
            --disable CONFIG_LOCALVERSION_AUTO
          # Perbaiki ssg-iosched: aktifkan blkcg
          scripts/config --file out/.config \
            -e CONFIG_CGROUPS \
            -e CONFIG_BLK_CGROUP
          # Perbaiki blocktag/ufs: lengkapi struct devfreq_simple_ondemand_data
          scripts/config --file out/.config \
            -e CONFIG_PM_DEVFREQ \
            -e CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND
          # Matikan Werror & debug
          sed -i 's/^CONFIG_WERROR=y/CONFIG_WERROR=n/g' out/.config
          scripts/config --file out/.config \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_DEBUG_INFO_SPLIT \
            --disable CONFIG_DEBUG_INFO_REDUCED \
            --disable CONFIG_DEBUG_INFO_DWARF4
          # MATIKAN v4l2 imgsensor (sumber duplikat + src-v4l2 bermasalah)
          scripts/config --file out/.config --disable CONFIG_MTK_V4L2_IMGSENSOR
          # Jawab otomatis semua opsi (NEW) dengan default
          make O=out ARCH=arm64 olddefconfig
          echo "Configuration complete."

      - name: Prepare stubs & patches
        run: |
          cd gta9
          # 1) Stub disp_arr.h
          printf '#ifndef __DISP_ARR_H__\n#define __DISP_ARR_H__\n/* Stub dibuat CI workflow */\n#endif\n' > drivers/gpu/mediatek/ged/src/disp_arr.h
          echo "Stub disp_arr.h created."
          # 2) Patch SEMUA proc_compat_ioctl di drivers/misc/mediatek
          grep -rl 'proc_compat_ioctl' drivers/misc/mediatek/ 2>/dev/null | xargs -r sed -i '/proc_compat_ioctl/d' || true
          echo "proc_compat_ioctl patched."
          # 3) Keluarkan ccci_fsm_scp.c
          sed -i '/ccci_fsm_scp/d' drivers/misc/mediatek/eccci/fsm/Makefile 2>/dev/null || true
          sed -i '/ccci_fsm_scp/d' drivers/misc/mediatek/eccci/fsm/Kbuild 2>/dev/null || true
          sed -i '/ccci_fsm_scp/d' drivers/misc/mediatek/eccci/fsm/Makefile.inc 2>/dev/null || true
          sed -i '/ccci_fsm_scp/d' drivers/misc/mediatek/eccci/fsm/Kbuild.inc 2>/dev/null || true
          echo "ccci_fsm_scp dikeluarkan."
          # 4) Keluarkan camera_mfb.c
          sed -i '/camera_mfb/d' drivers/misc/mediatek/cameraisp/mfb/isp_6s/Makefile 2>/dev/null || true
          sed -i '/camera_mfb/d' drivers/misc/mediatek/cameraisp/mfb/Makefile 2>/dev/null || true
          echo "camera_mfb dikeluarkan."
          # 5) lpm: asm/cpuidle.h butuh errno include
          sed -i '1i #include <linux/errno.h>' arch/arm64/include/asm/cpuidle.h 2>/dev/null || true
          echo "cpuidle.h patched."
          # 6) Keluarkan SELURUH swpm
          sed -i '/swpm/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          echo "swpm dikeluarkan."
          # 7) Keluarkan connectivity_build_in_adapter.c
          sed -i '/connectivity_build_in_adapter/d' drivers/misc/mediatek/connectivity/common/Makefile 2>/dev/null || true
          sed -i '/connectivity_build_in_adapter/d' drivers/misc/mediatek/connectivity/Makefile 2>/dev/null || true
          echo "connectivity_build_in_adapter dikeluarkan."
          # 8) Keluarkan SELURUH aee
          sed -i '/aee/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          echo "aee dikeluarkan."
          # 9) Keluarkan extcon-mtk-usb + mkp
          sed -i '/extcon-mtk-usb/d' drivers/misc/mediatek/extcon/Makefile 2>/dev/null || true
          sed -i '/extcon/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          sed -i '/mkp/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          sed -i '/mkp/d' drivers/misc/mediatek/mkp/Makefile 2>/dev/null || true
          echo "extcon-mtk-usb & mkp dikeluarkan."
          # 10) Keluarkan vow
          sed -i '/vow/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          sed -i '/vow/d' drivers/misc/mediatek/vow/ver02/Makefile 2>/dev/null || true
          echo "vow dikeluarkan."
          # 11) Keluarkan SELURUH folder sched
          sed -i '/sched/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          echo "sched seluruhnya dikeluarkan."
          # 12) Keluarkan task_turbo (pakai android_vendor_data1 yang tidak ada)
          sed -i '/task_turbo/d' drivers/misc/mediatek/Makefile 2>/dev/null || true
          sed -i '/task_turbo/d' drivers/misc/mediatek/task_turbo/Makefile 2>/dev/null || true
          echo "task_turbo dikeluarkan."
          # 13) HAPUS SELURUH folder src-v4l2 imgsensor (varian duplikat, banyak error)
          rm -rf drivers/misc/mediatek/imgsensor/src-v4l2
          sed -i "/src-v4l2/d" drivers/misc/mediatek/imgsensor/Makefile 2>/dev/null || true
          echo "imgsensor src-v4l2 dihapus total + referensi dibersihkan."
          # 14) Hapus cmdq-platform mt6853 (Tab A9 pakai MT6789; hapus FILE bukan baris Makefile biar ifneq/endif aman)
          rm -f drivers/misc/mediatek/cmdq/mailbox/cmdq-platform-mt6853.c
          rm -f drivers/misc/mediatek/cmdq/mailbox/cmdq-platform-mt6853.h
          rm -f drivers/misc/mediatek/cmdq/mailbox/cmdq-platform-mt6873.c
          echo "cmdq-platform mt6853 + mt6873 dibuang, mt6789 dipertahankan."
          # 15) Hapus dobel-sumber lain yg bikin duplicate symbol
          rm -f drivers/misc/mediatek/lens/vcm/proprietary/main/common/dw9763af/DW9763AF.c 2>/dev/null || true
          echo "dobel lens/cam_cal dibersihkan."
          echo "Prepare selesai."

      - name: Compile kernel
        run: |
          cd gta9
          export PATH=$HOME/toolchain/clang/bin:$PATH
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w -fcommon -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration" \
            KBUILD_LDFLAGS="-Wl,--allow-multiple-definition" \
            Image 2>&1 | tee $GITHUB_WORKSPACE/compile.log
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Build failed — kernel Image not found!"
            exit 1
          fi
          echo "Build successful! Image size: $(du -h out/arch/arm64/boot/Image | cut -f1)"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          rm -rf .git .github *.md
          cp $GITHUB_WORKSPACE/gta9/out/arch/arm64/boot/Image ./
          printf '%s\n' \
            'properties() {' \
            '  kernel.string=Galaxy Tab A9 (SM-X110) + KernelSU' \
            '  do.devicecheck=1' \
            '  do.modules=0' \
            '  do.cleanup=1' \
            '  do.cleanuponabort=1' \
            '  device.name1=gta9' \
            '  device.name2=gta9wifi' \
            '  device.name3=SM-X110' \
            '  supported.versions=13-14' \
            '}' \
            'block=auto' \
            'is_slot_device=0' \
            '. tools/ak3-core.sh' \
            'split_boot' \
            'flash_boot' > anykernel.sh
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="GTA9-KernelSU-${{ steps.ksu_info.outputs.ksu_version }}-${BUILD_DATE}.zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIP_NAME . -x '.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ github.run_number }}
          path: compile.log
