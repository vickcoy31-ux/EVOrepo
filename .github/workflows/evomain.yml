      - name: Prepare stubs & patches
        run: |
          cd gta9
          # 1) Stub disp_arr.h (di-generate build.sh Samsung, kita buat manual)
          cat > drivers/gpu/mediatek/ged/src/disp_arr.h << 'HDR_EOF'
          #ifndef __DISP_ARR_H__
          #define __DISP_ARR_H__
          /* Stub dibuat CI workflow — file asli di-generate build system Samsung */
          #endif
          HDR_EOF
          echo "Stub disp_arr.h created."
          # 2) blocktag-index: proc_ops tidak punya proc_compat_ioctl di kernel ini
          sed -i '/proc_compat_ioctl/d' drivers/misc/mediatek/blocktag/*.c
          echo "blocktag patched."
          # 3) scp_ipi.h untuk ccci_fsm_scp: cari di tree dulu, kalau tidak ada buat stub
          echo "=== Search scp_ipi.h in tree ==="
          SCP_HDR=$(find . -name "scp_ipi.h" 2>/dev/null | head -1)
          if [ -n "$SCP_HDR" ]; then
            echo "Found: $SCP_HDR"
            cp "$SCP_HDR" drivers/misc/mediatek/eccci/fsm/scp_ipi.h
          else
            echo "Not found — creating stub"
            cat > drivers/misc/mediatek/eccci/fsm/scp_ipi.h << 'HDR_EOF'
            #ifndef __SCP_IPI_H__
            #define __SCP_IPI_H__
            /* Stub untuk CI — header SCP MediaTek tidak tersedia di tree ini */
            #endif
            HDR_EOF
          fi
          echo "=== Does ccci_fsm_scp.c call scp_ipi functions? (diagnostik) ==="
          grep -n "scp_ipi" drivers/misc/mediatek/eccci/fsm/ccci_fsm_scp.c | head -20 || echo "  (no scp_ipi calls found)"
          echo "=== ccci_fsm_scp.c includes (diagnostik) ==="
          sed -n '1,25p' drivers/misc/mediatek/eccci/fsm/ccci_fsm_scp.c
